services:
  db:
    image: postgres:16-alpine
    container_name: email_agent_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-email_agent_prod}
      POSTGRES_USER: ${POSTGRES_USER:-email_agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-email_agent_user} -d ${POSTGRES_DB:-email_agent_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: email-auto-reply:latest
    container_name: email_agent_app
    env_file:
      - .env
    environment:
      # Override to postgres when using compose (dev can still use sqlite if DATABASE_URL not set)
      DATABASE_URL: ${DATABASE_URL:-postgresql://email_agent_user:change-me-strong@db:5432/email_agent_prod}
      HOST: "0.0.0.0"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./knowledge:/app/knowledge:ro
      # Optional secrets mount (create ./secrets dir with credentials.json/token.json, 600 perms)
      # - ./secrets:/app/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional: Nginx reverse proxy (uncomment for prod HTTPS)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     app:
  #       condition: service_healthy

volumes:
  pgdata:
    driver: local
