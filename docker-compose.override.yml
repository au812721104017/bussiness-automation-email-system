# Dev override: hot-reload without Postgres (sqlite). Use: docker compose up app
# Prod uses docker-compose.yml with postgres. For dev sqlite, run locally or use this override.
services:
  app:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
      - ./knowledge:/app/knowledge
      - ./gunicorn_conf.py:/app/gunicorn_conf.py
    environment:
      DATABASE_URL: sqlite:///./email_automation.db
      ENV: development
      LOG_LEVEL: INFO
    depends_on: []  # no db needed for sqlite dev
